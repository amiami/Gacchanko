services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports: ["3000:3000"]
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/packing_dev
    depends_on: [db]

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  bundle:
  pgdata: